# AAG LockLock 2.0.0-beta.2 configuration
# This file is parsed as data. It is never sourced by a shell.

# install.sh replaces these two placeholders on a fresh installation.
AUTHORIZED_UID=@AUTHORIZED_UID@
AUTHORIZED_USER=@AUTHORIZED_USER@

HOTKEY=CTRL+ALT+Z
EMERGENCY_HOTKEY=CTRL+ALT+SHIFT+F12
DEFAULT_MODE=all

# 0 disables the default timer. For the first test use --timeout 30 explicitly.
AUTO_UNLOCK_SECONDS=0

# If yes, the primary DEFAULT_MODE=all hotkey acts like all-input.
# Explicit CLI mode "all" still means keyboard + mouse + touchpad only.
LOCK_TOUCHSCREEN=yes
SHOW_NOTIFICATIONS=yes
PLAY_SOUND=no
DEBOUNCE_MS=700
UNLOCK_ON_SUSPEND=yes
UNLOCK_ON_SESSION_SWITCH=yes

# While keyboard input is grabbed, Ctrl+Alt+F1..F12 first unlocks all input.
# Press the TTY chord again after release to perform the VT switch.
UNLOCK_ON_VT_HOTKEY=yes

# Comma-separated exact paths or glob patterns. Stable /dev/input/by-id paths
# are recommended. Spaces inside an entry are allowed.
EXCLUDE_DEVICES=

# Comma-separated lowercase hexadecimal pairs, for example 046d:c31c.
EXCLUDE_VENDOR_PRODUCT=

SOCKET_PATH=/run/input-lock/control.sock
STATE_PATH=/run/input-lock/state.json
